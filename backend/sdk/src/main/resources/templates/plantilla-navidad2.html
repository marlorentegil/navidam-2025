<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Postal de Navidad</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #f5f5dc, #fffdfd);
            margin: 0;
            padding: 0;
            text-align: center;
        height: 100vh;
            
        }

        main {
            width: 60%;
            margin: auto;
            background: #fff;
            border: 2px solid #d33;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #d33;
            text-shadow: 2px 2px #f5f5dc;
        }

        p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        ul {
            font-size: 1.2em;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            margin: 10px 0;
            background: #e0f7fa;
            border-left: 5px solid #2e7d32;
            padding: 10px;
            border-radius: 10px;
        }

        audio {
            margin-top: 20px;
        }

        footer {
            margin-top: 20px;
            padding: 10px;
            background: #d33;
            color: #fff;
            font-size: 1em;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
    </style>
</head>
<body>
    <main>
        <h1>🎄 Feliz Navidad 🎄</h1>
        <p th:text="'Para: ' + ${m.remitente}"></p>
        <p th:text="'Para: ' + ${m.destinatario}"></p>
        <p th:text="'Para: ' + ${m.contenido}"></p>
        <p th:text="'Para: ' + ${m.fecha}"></p>
        <p th:text="'Para: ' + ${m.melodia}"></p>
    </main>
    <footer>Generado con NaviDAM</footer>
</body>
</html>
